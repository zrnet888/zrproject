<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZRTV Radio</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

button{
    width:90%;
    padding:15px;
    margin:5px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    font-size:16px;
}

button:hover{
    background:#333;
}

audio{
    width:90%;
    margin-top:20px;
}

#volume{
    width:90%;
}
</style>
</head>

<body>

<h2>📻 ZRTV Radio</h2>

<div id="radioList">Loading...</div>

<br>
🔊 Volume Booster
<br><br>

<input type="range" id="volume" min="1" max="6" step="0.1" value="1">

<audio id="player" controls></audio>

<script>

const playlist = "https://raw.githubusercontent.com/zrnet888/Zrnettv/refs/heads/main/FM19JT.m3u";

const player = document.getElementById("player");

const AudioContextClass = window.AudioContext || window.webkitAudioContext;
const audioContext = new AudioContextClass();

const track = audioContext.createMediaElementSource(player);

const gainNode = audioContext.createGain();

track.connect(gainNode);
gainNode.connect(audioContext.destination);

document.getElementById("volume").addEventListener("input", function () {
    gainNode.gain.value = this.value;
});

fetch(playlist)
.then(response => response.text())
.then(text => {

    const lines = text.split("\n");

    const radioList = [];

    for(let i=0;i<lines.length;i++){

        if(lines[i].startsWith("#EXTINF")){

            const name = lines[i].split(",")[1];

            const url = lines[i+1].trim();

            if(url.startsWith("https://")){

                radioList.push({
                    name:name,
                    url:url
                });

            }

        }

    }

    const container = document.getElementById("radioList");

    container.innerHTML = "";

    radioList.forEach(radio => {

        const button = document.createElement("button");

        button.innerText = radio.name;

        button.onclick = async () => {

            try{

                await audioContext.resume();

                player.src = radio.url;

                player.play();

            }catch(err){

                alert("Radio gagal diputar");

                console.log(err);

            }

        };

        container.appendChild(button);

    });

});
</script>

</body>
</html>
