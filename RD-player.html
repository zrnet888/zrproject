```html
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZRTV Radio</title>

<style>
body{
    background:#111;
    color:white;
    font-family:Arial;
    text-align:center;
    padding:20px;
}

button{
    width:90%;
    margin:5px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    font-size:16px;
}

button:hover{
    background:#333;
}

#volume{
    width:90%;
}
</style>
</head>

<body>

<h2>📻 ZRTV Radio</h2>

<div id="radioList">Loading...</div>

<br>
🔊 Volume Booster
<br><br>

<input type="range" id="volume" min="1" max="6" step="0.1" value="1">

<audio id="player" controls autoplay></audio>

<script>

const M3U_URL = "https://raw.githubusercontent.com/zrnet888/Zrnettv/refs/heads/main/FM19JT.m3u";

const player = document.getElementById("player");

const audioContext = new (window.AudioContext || window.webkitAudioContext)();

const source = audioContext.createMediaElementSource(player);

const gainNode = audioContext.createGain();

source.connect(gainNode);
gainNode.connect(audioContext.destination);

document.getElementById("volume").addEventListener("input", function(){
    gainNode.gain.value = this.value;
});

fetch(M3U_URL)
.then(res => res.text())
.then(data => {

    const lines = data.split("\n");

    let radios = [];

    for(let i=0;i<lines.length;i++){

        if(lines[i].startsWith("#EXTINF")){
            const name = lines[i].split(",")[1];

            const url = lines[i+1].trim();

            radios.push({
                name:name,
                url:url
            });
        }
    }

    const container = document.getElementById("radioList");

    container.innerHTML = "";

    radios.forEach(radio=>{

        const btn = document.createElement("button");

        btn.innerText = radio.name;

        btn.onclick = ()=>{

            player.src = radio.url;

            player.play();

            audioContext.resume();
        };

        container.appendChild(btn);
    });

});

</script>

</body>
</html>
```
