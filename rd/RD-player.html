button{
    width:90%;

    width:90%;

<body>

<h2>📻 ZRTV Radio</h2>

<button onclick="playRadio()">
Play Radio
</button>

<br><br>

<audio id="player" controls></audio>

<script>

const player =
document.getElementById("player");

const audioContext =
new (window.AudioContext || window.webkitAudioContext)();

const source =
audioContext.createMediaElementSource(player);

const gainNode =
audioContext.createGain();

source.connect(gainNode);

gainNode.connect(audioContext.destination);

/* 200% volume */
gainNode.gain.value = 2;

function playRadio(){

    player.src =
    "https://n03-us.rcs.revma.com/k02rmq48kxcwv?rj-ttl=5&rj-tok=AAABnzD831YA4gnNZfMl63R8cg";

    audioContext.resume();

    player.play();

}

</script>

</body>
